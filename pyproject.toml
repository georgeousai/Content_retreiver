[project]
name = "reel-vault"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    # Used as an HTTP client for the OpenAI-compatible wire format, not as a
    # commitment to OpenAI: `base_url` decides who answers. Groq, DeepSeek,
    # Qwen, Together, Mistral and Google's compatibility endpoint all speak it.
    "openai>=1.60.0",
    # Headless: the frame sampler decodes video and encodes JPEGs, and never
    # opens a window. The GUI build pulls in a desktop toolkit for nothing.
    "opencv-python-headless>=4.10.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "scenedetect>=0.6.4",
    "sentence-transformers>=6.0.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
reel-vault = "reel_vault.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_vault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
